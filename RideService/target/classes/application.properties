spring.application.name=RideService

server.port=8084
eureka.client.service-url.defaultZone: http://localhost:8761/eureka/
#Remote postgress connection - neon
spring.datasource.url=jdbc:postgresql://ep-small-haze-ait2utky-pooler.c-4.us-east-1.aws.neon.tech/cabbie_db1?sslmode=require&channel_binding=require

spring.datasource.username=neondb_owner
spring.datasource.password=npg_sjlGu3bCP2DZ

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Kafka (adjust bootstrap for your cluster) ---
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Plain JSON without type headers so other services can deserialize by listener parameter type.
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=ride-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Required when producer uses spring.json.add.type.headers=false (no type in headers).
spring.kafka.consumer.properties.spring.json.value.default.type=com.cabbie.ride.event.DriverAssignedEvent

spring.kafka.properties.spring.json.trusted.packages=*
